spring:
  application:
    name: parking-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:h2:mem:parkingdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Dynamic pricing config (Day 12)
parking:
  pricing:
    base-rate: 100.0
    high-occupancy-threshold: 0.8
    high-occupancy-multiplier: 1.5
    peak-hour-enabled: true
    peak-hour-multiplier: 1.2
    peak-hours:
      - start: "08:00"
        end: "10:00"
      - start: "17:00"
        end: "19:00"
  reservation:
    expiry-minutes: 15
    expiry-check-interval-ms: 60000
