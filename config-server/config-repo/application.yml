# Shared configuration inherited by ALL microservices that pull from the Config Server.
# Service-specific overrides live in <service-name>.yml in this same folder.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.spms: INFO
    org.springframework.cloud: INFO
