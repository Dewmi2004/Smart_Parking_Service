server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Lets Gateway auto-create routes like /USER-SERVICE/** from Eureka
          # registrations too, but we also define explicit, cleaner routes below.
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /users/${segment}

        - id: vehicle-service
          uri: lb://VEHICLE-SERVICE
          predicates:
            - Path=/api/vehicles/**
          filters:
            - RewritePath=/api/vehicles/(?<segment>.*), /vehicles/${segment}

        - id: parking-service
          uri: lb://PARKING-SERVICE
          predicates:
            - Path=/api/spaces/**
          filters:
            - RewritePath=/api/spaces/(?<segment>.*), /spaces/${segment}

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /payments/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
